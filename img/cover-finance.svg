<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg-f" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent-f" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow-f" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-f" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#10B981" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="400" height="250" fill="url(#bg-f)"/>
  <rect width="400" height="250" fill="url(#dots-f)"/>
  <ellipse cx="200" cy="125" rx="140" ry="95" fill="url(#glow-f)"/>
  <!-- Decorative shapes -->
  <rect x="35" y="35" width="30" height="30" rx="5" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.15" transform="rotate(25 50 50)"/>
  <circle cx="355" cy="55" r="16" fill="none" stroke="#10B981" stroke-width="1" opacity="0.12"/>
  <circle cx="50" cy="190" r="10" fill="none" stroke="#10B981" stroke-width="1" opacity="0.1"/>
  <!-- Coin Stack -->
  <g transform="translate(90, 70)">
    <ellipse cx="30" cy="75" rx="28" ry="8" fill="#10B981" opacity="0.15"/>
    <ellipse cx="30" cy="65" rx="28" ry="8" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <rect x="2" y="55" width="56" height="10" fill="#10B981" opacity="0.15"/>
    <ellipse cx="30" cy="55" rx="28" ry="8" fill="#10B981" opacity="0.25" stroke="#10B981" stroke-width="1"/>
    <rect x="2" y="45" width="56" height="10" fill="#10B981" opacity="0.2"/>
    <ellipse cx="30" cy="45" rx="28" ry="8" fill="#10B981" opacity="0.35" stroke="#10B981" stroke-width="1"/>
    <rect x="2" y="35" width="56" height="10" fill="#10B981" opacity="0.25"/>
    <ellipse cx="30" cy="35" rx="28" ry="8" fill="#10B981" opacity="0.5" stroke="#10B981" stroke-width="1.2"/>
    <!-- Rupee symbol on top coin -->
    <text x="30" y="40" text-anchor="middle" fill="#1E293B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">₹</text>
  </g>
  <!-- Chart Line -->
  <g transform="translate(190, 60)">
    <rect x="0" y="0" width="130" height="85" rx="8" fill="#10B981" opacity="0.06" stroke="#10B981" stroke-width="1" opacity="0.15"/>
    <!-- Grid -->
    <line x1="15" y1="20" x2="115" y2="20" stroke="#10B981" stroke-width="0.5" opacity="0.1"/>
    <line x1="15" y1="40" x2="115" y2="40" stroke="#10B981" stroke-width="0.5" opacity="0.1"/>
    <line x1="15" y1="60" x2="115" y2="60" stroke="#10B981" stroke-width="0.5" opacity="0.1"/>
    <!-- Area fill -->
    <path d="M15 65 L35 50 L55 55 L75 35 L95 25 L115 12 L115 65 Z" fill="#10B981" opacity="0.1"/>
    <!-- Line -->
    <polyline points="15,65 35,50 55,55 75,35 95,25 115,12" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <circle cx="115" cy="12" r="4" fill="#10B981"/>
    <circle cx="115" cy="12" r="7" fill="#10B981" opacity="0.2"/>
  </g>
  <!-- Wallet icon -->
  <g transform="translate(280, 150)" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.5">
    <rect x="0" y="0" width="40" height="28" rx="5"/>
    <path d="M0 8 L40 8"/>
    <circle cx="32" cy="18" r="3" fill="#10B981" opacity="0.4"/>
  </g>
  <!-- Floating rupee symbols -->
  <text x="175" y="165" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" opacity="0.2">₹</text>
  <text x="340" cy="120" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" opacity="0.15">₹</text>
  <!-- Title -->
  <text x="200" y="210" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">Personal Finance &amp;</text>
  <text x="200" y="232" text-anchor="middle" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">Investment Guide</text>
  <!-- Corner accents -->
  <path d="M0 0 L30 0 L30 4 L4 4 L4 30 L0 30 Z" fill="#10B981" opacity="0.3"/>
  <path d="M400 250 L370 250 L370 246 L396 246 L396 220 L400 220 Z" fill="#10B981" opacity="0.3"/>
</svg>
